<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akari</title>
    <link rel="stylesheet" href="../css/root.css">
    <style>
        #akari-table {
            position: relative;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-collapse: collapse;
        }
        .cell {
            width: 25px;
            height: 25px;
            border: 1px solid black;
        }

        .cell>input[type="text"] {
            margin: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            outline: none;
            text-align: center;
            font-weight: 600;
            font-size: 20px;
            padding: 0 !important;
        }
    </style>
</head>

<body>
    <div id="page-container">
        <div id="page-header">
            <div id="website-left"><a href="../index.html">Home</a></div>
            <h2 id="title">Akari</h2>
            <div id="website-right">a5a7</div>
        </div>
        <div id="gen-container">
            <div id="gen-output">
                <table id="akari-table">

                </table>
            </div>
            <div id="gen-controls">
                <input type="number" placeholder="Rows (default is 10)" id="rows">
                <input type="number" placeholder="Columns (default is 10)" id="cols">
                <input type="submit" value="Change board" id="board">
                <input type="submit" value="Solve" id="solve">
                <div id="error" style="color: var(--red)"></div>
                <div>Type 'X' to denote a wall or a number from 0-4 to denote the number of adjacencies. The '+' signs denote light bulbs.</div>
            </div>
        </div>
    </div>
    <script src="../lib/html.js"></script>
    <script src="../js/akari.js"></script>
</body>

</html>
